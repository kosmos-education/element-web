<!doctype html>
<html lang="fr">
    <head>
        <title>La Bulle</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>

    <body>
        <div class="mx_HomePage_errorContainer">
            <!-- populated by JS if needed -->
        </div>

        <main class="mx_HomePage_container">
            <img class="mx_Logo" src="./assets/donut-skolengo.svg" alt="" width="96" height="96" />

            <h1 id="heading">La Bulle est disponible sur votre application Skolengo</h1>
            <p id="intro">Communiquez encore plus efficacement avec vos collaborateurs.</p>

            <ol class="mx_Steps">
                <li>
                    <h2 id="step1_heading">Téléchargez l’application Skolengo</h2>
                    <div class="mx_StoreLinks">
                        <a id="app_store_link" class="mx_StoreBadge" target="_blank" rel="noreferrer noopener">
                            <img
                                id="app_store_badge"
                                src="./assets/app-store-badge.svg"
                                alt=""
                                width="120"
                                height="40"
                            />
                        </a>
                        <a id="play_store_link" class="mx_StoreBadge" target="_blank" rel="noreferrer noopener">
                            <img
                                id="play_store_badge"
                                src="./assets/google-play-badge.svg"
                                alt=""
                                width="135"
                                height="40"
                            />
                        </a>
                    </div>
                </li>
                <li>
                    <h2 id="step2_heading">Lancez l’application et connectez-vous</h2>
                </li>
            </ol>

            <!-- Seul chemin d'accès à La Bulle depuis un navigateur mobile, que la page
                 d'accueil d'Element redirige systématiquement vers ce guide. -->
            <p class="mx_BackToSite">
                <a id="back_to_element_button" href="#">Continuer sur le site web</a>
            </p>
        </main>
    </body>
</html>
